url: https://github.com/1015677515/dsh-prompt-ErrorNotes-desk
name: 1015677515/dsh-prompt-ErrorNotes-desk
category: memory
description:
  en: 'Captures the agent''s own self-reported mistakes ("我犯了个错误：…") into a categorised lesson library that is re-injected into the system prompt every turn, with every captured draft confirmed or edited by the user before it is recorded, and adds two conversation-header panels for editing the cross-conversation global prompt and a per-session prompt.'
  zh: '把 agent 自己说出的错误自动收进分类经验库并每轮回注系统提示词（每条草稿都先经用户确认或修改），同时在对话标题栏提供两个面板，用于编辑跨对话全局提示词与本次对话提示词。'
